[package]
name = "ketu"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = {version="0.8", features =["macros"]}
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
